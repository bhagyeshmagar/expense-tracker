<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Expenses Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
  <nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" th:href="@{/}">Expense Tracker</a>
      <a th:href="@{/expenses/new}" class="btn btn-primary">+ Add Expense</a>
    </div>
  </nav>

  <div class="container my-4">
    <h2>Dashboard</h2>
    <p>Total expenses: <strong th:text="${#lists.size(expenses)}">0</strong></p>

    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Amount (₹)</th>
          <th>Category</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="e : ${expenses}">
          <td th:text="${e.id}">1</td>
          <td th:text="${e.title}">Lunch</td>
          <td th:text="${T(java.lang.String).format('%.2f', e.amount.doubleValue())}">200.00</td>
          <td th:text="${e.category}">FOOD</td>
          <td th:text="${e.expenseDate}">2025-11-10</td>
          <td>
             <a th:href="@{'/expenses/edit/' + ${e.id}}" class="btn btn-sm btn-secondary me-1">Edit</a>
             <a th:href="@{'/expenses/delete/' + ${e.id}}" class="btn btn-sm btn-danger">Delete</a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(expenses)}">
          <td colspan="6" class="text-center text-muted">No expenses recorded.</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
