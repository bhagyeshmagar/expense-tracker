<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title th:text="${expense.id} != null ? 'Edit Expense' : 'Add Expense'">Add Expense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
  <nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" th:href="@{/}">Expense Tracker</a>
      <a th:href="@{/expenses}" class="btn btn-outline-secondary">Back</a>
    </div>
  </nav>

  <div class="container my-4">
    <h2 th:text="${expense.id} != null ? 'Edit Expense' : 'Add New Expense'">Add New Expense</h2>

    <form th:action="@{/expenses}" th:object="${expense}" method="post" class="row g-3">
      <!-- hidden id so save() will update when id present -->
      <input type="hidden" th:field="*{id}" />

      <div class="col-12">
        <label class="form-label">Title</label>
        <input type="text" th:field="*{title}" class="form-control" placeholder="e.g., Lunch" required />
      </div>

      <div class="col-md-4">
        <label class="form-label">Amount (₹)</label>
        <input type="number" step="0.01" th:field="*{amount}" class="form-control" placeholder="0.00" required />
      </div>

      <div class="col-md-4">
        <label class="form-label">Category</label>
        <select th:field="*{category}" class="form-select" required>
          <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Date</label>
        <input type="date" th:field="*{expenseDate}" class="form-control" required />
      </div>

      <!-- CSRF guard (works when Spring Security present) -->
      <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="col-12">
        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/expenses}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>

</body>
</html>
