<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title th:replace="${title} ?: 'Expense Tracker'">Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
  <header th:fragment="header">
    <nav class="navbar navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Expense Tracker</a>
        <a th:href="@{/expenses/new}" class="btn btn-primary">+ Add Expense</a>
      </div>
    </nav>
  </header>

  <main class="container my-4" th:fragment="content">
    <!-- content will be inserted here by pages -->
  </main>

  <footer th:fragment="footer" class="text-center py-4">
    <small>© ExpenseTracker</small>
  </footer>

</body>
</html>
