<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard - Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}">Expense Tracker</a>
    <a th:href="@{/expenses/new}" class="btn btn-primary">+ Add Expense</a>
  </div>
</nav>

<div class="container my-4">
  <h2>Dashboard</h2>
  <p>Total expenses: <strong th:text="${#lists.size(expenses)}">0</strong></p>

  <table class="table table-striped">
    <thead><tr><th>ID</th><th>Title</th><th>Amount (₹)</th><th>Category</th><th>Date</th></tr></thead>
    <tbody>
      <tr th:each="e : ${expenses}">
        <td th:text="${e.id}">1</td>
        <td th:text="${e.title}">Title</td>
        <td th:text="${e.amount}">0</td>
        <td th:text="${e.category}">FOOD</td>
        <td th:text="${e.expenseDate}">2025-01-01</td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
