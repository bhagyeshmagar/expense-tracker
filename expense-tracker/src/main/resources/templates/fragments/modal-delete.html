<!-- modal-delete.html -->
<! -- Thymeleaf fragment for a reusable Bootstrap confirm-delete modal -->
<div th:fragment="modal-delete">
  <!-- Modal -->
  <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="confirmDeleteLabel">Confirm delete</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <p>Are you sure you want to delete this expense?</p>
        </div>

        <div class="modal-footer">
          <!-- The form action is set dynamically by JS before showing the modal -->
          <form id="confirmDeleteForm" th:action="@{/expenses/delete/0}" method="post" style="margin:0;">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-danger">Delete</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
